<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slither Clone Professional - 60FPS</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; }

        /* UI Layers */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; color: white; }
        .hud { pointer-events: auto; }

        /* Start Menu */
        #menu { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85); padding: 30px; border-radius: 15px;
            border: 2px solid #444; text-align: center; pointer-events: auto; min-width: 300px;
        }
        input { padding: 10px; width: 80%; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        button { 
            padding: 12px 25px; background: #2ecc71; border: none; color: white; 
            font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 18px; transition: 0.2s;
        }
        button:hover { background: #27ae60; transform: scale(1.05); }

        /* Leaderboard */
        #leaderboard { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 5px; font-size: 14px; width: 180px; }
        .lb-entry { display: flex; justify-content: space-between; margin-bottom: 3px; }
        .lb-me { color: #f1c40f; font-weight: bold; }

        /* Score & Minimap */
        #score-display { position: absolute; bottom: 20px; left: 20px; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 2px #000; }
        #minimap-container { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 150px; background: rgba(0,0,0,0.5); border: 2px solid #555; border-radius: 50%; overflow: hidden; }
        
        /* Game Over */
        #game-over { 
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9); padding: 40px; border-radius: 15px; text-align: center; pointer-events: auto;
        }
        /* Espace Publicitaire */
        #ad-container { width: 300px; height: 250px; background: #222; margin: 20px auto; display: flex; align-items: center; justify-content: center; color: #555; border: 1px dashed #444; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="menu">
            <h1 style="color: #2ecc71; margin-top: 0;">SLITHER.JS</h1>
            <input type="text" id="nickname" placeholder="Nickname" maxlength="12" value="Player1">
            <br>
            <button onclick="startGame()">PLAY</button>
        </div>

        <div id="leaderboard" class="hud" style="display:none;">
            <h4 style="margin: 0 0 10px 0; border-bottom: 1px solid #777;">Leaderboard</h4>
            <div id="lb-content"></div>
        </div>

        <div id="score-display" class="hud" style="display:none;">Length: 10</div>

        <div id="minimap-container" class="hud" style="display:none;">
            <canvas id="minimapCanvas" width="150" height="150"></canvas>
        </div>

        <div id="game-over">
            <h2 style="color: #e74c3c;">DIED!</h2>
            <p id="final-score">Your score: 0</p>
            <div id="ad-container">
                ADVERTISEMENT AREA
            </div>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>
</div>

<script>
/**
 * CONFIGURATION & CONSTANTES
 */
const WORLD_SIZE = 5000;
const INITIAL_LENGTH = 10;
const SEGMENT_DISTANCE = 5; // Distance fixe entre segments
const BOT_COUNT = 25;
const FOOD_COUNT = 1500;
const MAX_SPEED = 2.0;
const BOOST_SPEED = 4.0;
const COLORS = ['#2ecc71', '#3498db', '#9b59b6', '#f1c40f', '#e67e22', '#e74c3c', '#1abc9c', '#fd79a8'];

/**
 * CORE ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimisation : pas d'alpha sur le canvas principal
const mCanvas = document.getElementById('minimapCanvas');
const mCtx = mCanvas.getContext('2d');

let width, height, player, snakes, foodPool, gameActive = false;
let keys = {};
let mouse = { x: 0, y: 0 };
let cam = { x: 0, y: 0, zoom: 1 };

/**
 * CLASSES PRINCIPALES
 */

class Food {
    constructor() {
        this.active = false;
        this.x = 0;
        this.y = 0;
        this.size = 0;
        this.color = '';
        this.isBig = false;
    }
    spawn(x, y, size, color, isBig = false) {
        this.x = x;
        this.y = y;
        this.size = size;
        this.color = color;
        this.active = true;
        this.isBig = isBig;
    }
}

class Snake {
    constructor(id, name, color, isBot = false) {
        this.id = id;
        this.name = name;
        this.color = color;
        this.isBot = isBot;
        this.init();
    }

    init() {
        this.x = Math.random() * WORLD_SIZE;
        this.y = Math.random() * WORLD_SIZE;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = MAX_SPEED;
        if (this.isBot) {
            this.length = 10 + Math.random() * 90; 
        } else {
            this.length = INITIAL_LENGTH;
        }
        this.score = 0;
        this.isBoosting = false;
        this.dead = false;
        
        // Historique des positions pour l'effet d'ondulation (Slithering)
        this.history = [];
        for(let i=0; i < 200; i++) {
            this.history.push({x: this.x, y: this.y});
        }
        
        // Cible pour l'IA
        this.targetAngle = this.angle;
        this.aiTimer = 0;
    }

    update() {
        if(this.dead) return;

        // Gestion Boost
        if (this.isBoosting && this.length > 5) {
            this.speed = BOOST_SPEED;
            this.length -= 0.05;
            // Ejection de nourriture derrière
            if (Math.random() > 0.8) spawnFood(this.history[this.history.length-1].x, this.history[this.history.length-1].y, 2, this.color, false);
        } else {
            this.speed = MAX_SPEED;
        }

        // Contrôles Direction
        if(this.isBot) {
            this.updateAI();
        } else {
            this.updatePlayerAngle();
        }

        // Interpolation de l'angle (rotation fluide)
        let angleDiff = this.targetAngle - this.angle;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        this.angle += angleDiff * 0.1;

        // Mouvement
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        // Limites du monde
        if(this.x < 0 || this.x > WORLD_SIZE || this.y < 0 || this.y > WORLD_SIZE) this.die();

        // Mise à jour historique
        this.history.unshift({x: this.x, y: this.y});
        if(this.history.length > 1000) this.history.pop();

        // Calcul score
        this.score = Math.floor(this.length * 10);
    }

    updatePlayerAngle() {
        if (keys['ArrowLeft'] || keys['q'] || keys['a']) this.targetAngle -= 0.1;
        if (keys['ArrowRight'] || keys['d']) this.targetAngle += 0.1;
        
        // Souris prend le dessus si elle bouge
        let dx = mouse.x - width/2;
        let dy = mouse.y - height/2;
        this.targetAngle = Math.atan2(dy, dx);
    }

    updateAI() {
        this.aiTimer--;
        if(this.aiTimer <= 0) {
            this.targetAngle += (Math.random() - 0.5) * 2;
            this.aiTimer = 30 + Math.random() * 50;
            // Chance de boost aléatoire
            this.isBoosting = Math.random() > 0.9 && this.length > 15;
        }
        
        // Evitement sommaire des bords
        if(this.x < 200 || this.x > WORLD_SIZE - 200 || this.y < 200 || this.y > WORLD_SIZE - 200) {
            this.targetAngle = Math.atan2(WORLD_SIZE/2 - this.y, WORLD_SIZE/2 - this.x);
        }
    }

    die() {
        this.dead = true;
        // Explosion en nourriture
        const step = Math.floor(this.length / 5);
        for(let i=0; i < this.length; i += 2) {
            const pos = this.history[i * 2] || this.history[this.history.length-1];
            spawnFood(pos.x + (Math.random()-0.5)*20, pos.y + (Math.random()-0.5)*20, 4 + Math.random()*4, this.color, true);
        }
        if(this.isBot) {
            setTimeout(() => this.init(), 2000);
        } else {
            gameOver();
        }
    }

    draw() {
        if(this.dead) return;

        // Frustum Culling : on ne dessine que si la tête est proche de l'écran
        if (!isInView(this.x, this.y, 1000)) return;

        const radius = 8 + Math.log(this.length) * 3; // Croissance logarithmique
        
        // Dessiner le corps (en partant de la fin pour que la tête soit au dessus)
        ctx.fillStyle = this.color;
        for (let i = Math.floor(this.length * 3); i > 0; i -= 3) {
            const index = i * 2;
            if (this.history[index]) {
                const pos = this.history[index];
                if (isInView(pos.x, pos.y, radius)) {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, radius * (1 - i/(this.length*10)), 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Tête
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.beginPath();
        ctx.arc(0, 0, radius + 2, 0, Math.PI * 2);
        ctx.fill();
        
        // Yeux
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(radius*0.5, -radius*0.4, radius*0.3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(radius*0.5, radius*0.4, radius*0.3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath(); ctx.arc(radius*0.7, -radius*0.4, radius*0.15, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(radius*0.7, radius*0.4, radius*0.15, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        // Nom
        if(!this.isBot) {
            ctx.fillStyle = "white";
            ctx.font = "bold 14px Arial";
            ctx.textAlign = "center";
            ctx.fillText(this.name, this.x, this.y - radius - 10);
        }
    }
}

/**
 * GESTION GLOBALE
 */

function initFoodPool() {
    foodPool = Array.from({length: FOOD_COUNT}, () => new Food());
    for(let i=0; i < 1000; i++) {
        spawnFood(Math.random()*WORLD_SIZE, Math.random()*WORLD_SIZE, Math.random()*3 + 1, COLORS[Math.floor(Math.random()*COLORS.length)], false);
    }
}

function spawnFood(x, y, size, color, isBig) {
    const food = foodPool.find(f => !f.active);
    if(food) food.spawn(x, y, size, color, isBig);
}

function isInView(x, y, margin) {
    return x > cam.x - margin && x < cam.x + width/cam.zoom + margin &&
           y > cam.y - margin && y < cam.y + height/cam.zoom + margin;
}

function checkCollisions() {
    snakes.forEach(snake => {
        if(snake.dead) return;

        // Collision Tête vs Nourriture
        foodPool.forEach(f => {
            if(!f.active) return;
            const dist = Math.hypot(snake.x - f.x, snake.y - f.y);
            if(dist < (10 + Math.log(snake.length)*3)) {
                f.active = false;
                snake.length += f.isBig ? 0.5 : 0.15;
                if(!f.isBig) spawnFood(Math.random()*WORLD_SIZE, Math.random()*WORLD_SIZE, Math.random()*3+1, COLORS[Math.floor(Math.random()*COLORS.length)], false);
            }
        });

        // Collision Tête vs Corps (Uniquement contre les AUTRES serpents)
        snakes.forEach(other => {
            if(other.dead || snake.id === other.id) return; // AJUSTEMENT : On ignore si c'est soi-même

            const otherRadius = 8 + Math.log(other.length) * 3;

            // On vérifie les segments de l'adversaire
            for(let i = 0; i < other.length * 3; i += 5) {
                const pos = other.history[i * 2];
                if(!pos) break;
                
                const dist = Math.hypot(snake.x - pos.x, snake.y - pos.y);
                if(dist < otherRadius * 0.8) {
                    snake.die();
                    return;
                }
            }
        });
    });
}

/**
 * RENDU & LOOP
 */

function drawGrid() {
    const size = 100;
    ctx.strokeStyle = "#151515";
    ctx.lineWidth = 1;
    ctx.beginPath();
    
    const startX = Math.floor(cam.x / size) * size;
    const startY = Math.floor(cam.y / size) * size;

    for (let x = startX; x < cam.x + width/cam.zoom; x += size) {
        ctx.moveTo(x, cam.y);
        ctx.lineTo(x, cam.y + height/cam.zoom);
    }
    for (let y = startY; y < cam.y + height/cam.zoom; y += size) {
        ctx.moveTo(cam.x, y);
        ctx.lineTo(cam.x + width/cam.zoom, y);
    }
    ctx.stroke();

    // Bordures
    ctx.strokeStyle = "red";
    ctx.lineWidth = 5;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);
}

function updateHUD() {
    document.getElementById('score-display').innerText = `Length: ${Math.floor(player.length)}`;
    
    // Leaderboard
    const sorted = [...snakes].sort((a,b) => b.score - a.score).slice(0, 10);
    let html = '';
    sorted.forEach((s, i) => {
        html += `<div class="lb-entry ${s.id === player.id ? 'lb-me' : ''}">
            <span>${i+1}. ${s.name}</span><span>${s.score}</span>
        </div>`;
    });
    document.getElementById('lb-content').innerHTML = html;

    // Minimap
    mCtx.clearRect(0,0,150,150);
    mCtx.fillStyle = "rgba(255,255,255,0.5)";
    const mx = (player.x / WORLD_SIZE) * 150;
    const my = (player.y / WORLD_SIZE) * 150;
    mCtx.beginPath(); mCtx.arc(mx, my, 3, 0, Math.PI*2); mCtx.fill();
}

function gameLoop() {
    if(!gameActive) return;

    // 1. Logique
    snakes.forEach(s => s.update());
    checkCollisions();

    // 2. Caméra (Zoom dynamique selon la taille)
    const targetZoom = Math.max(0.4, 1 - (player.length / 500));
    cam.zoom += (targetZoom - cam.zoom) * 0.01;
    cam.x = player.x - (width / 2) / cam.zoom;
    cam.y = player.y - (height / 2) / cam.zoom;

    // 3. Rendu
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, width, height);

    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    drawGrid();

    // Rendu Nourriture (Culling)
    foodPool.forEach(f => {
        if(f.active && isInView(f.x, f.y, 20)) {
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI*2);
            ctx.fill();
        }
    });

    snakes.forEach(s => s.draw());

    updateHUD();
    requestAnimationFrame(gameLoop);
}

/**
 * INITIALISATION ET EVENTS
 */

function startGame() {
    const nick = document.getElementById('nickname').value || "Player";
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    initFoodPool();
    
    player = new Snake(0, nick, COLORS[0], false);
    snakes = [player];
    
    for(let i=1; i<=BOT_COUNT; i++) {
        snakes.push(new Snake(i, "Bot_"+i, COLORS[i % COLORS.length], true));
    }

    document.getElementById('menu').style.display = 'none';
    document.getElementById('game-over').style.display = 'none';
    document.querySelectorAll('.hud').forEach(el => el.style.display = 'block');
    
    gameActive = true;
    gameLoop();
}

function gameOver() {
    gameActive = false;
    document.getElementById('game-over').style.display = 'block';
    document.getElementById('final-score').innerText = `Your score: ${player.score}`;
}

function restartGame() {
    startGame();
}

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

window.onkeydown = (e) => { keys[e.key] = true; if(e.key === ' ') player.isBoosting = true; };
window.onkeyup = (e) => { keys[e.key] = false; if(e.key === ' ') player.isBoosting = false; };
window.onmousemove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
window.onmousedown = () => { if(player) player.isBoosting = true; };
window.onmouseup = () => { if(player) player.isBoosting = false; };

</script>
</body>
</html>
